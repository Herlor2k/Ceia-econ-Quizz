<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9e1620">
<meta name="robots" content="noindex, nofollow">
<title>Ceia Econômica de Natal | Teste gratuito</title>
<meta name="description" content="Teste gratuito: descubra em 1 minuto quanto dinheiro você pode economizar na ceia de Natal usando o que já tem em casa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf5ef; --card:#fff; --ink:#2b1712; --muted:#7a6158; --line:#f0e0d6;
  --red:#b3141f; --red-dk:#7e0e16; --red-50:#fde8e8;
  --green:#16a34a; --green-50:#dcfce7; --cta:#22c55e; --cta-dk:#0f8a3c;
  --gold:#e8a628; --gold-50:#fff3d6;
  --wine:#5c1a1f; --wine-dk:#3b0f12;
  --blue:#2563eb; --blue-50:#e0ebff; --purple:#7c3aed; --purple-50:#efe8ff; --orange:#f59e0b; --orange-50:#fff3d6;
  --shadow:0 10px 30px -12px rgba(92,26,31,.28),0 2px 6px rgba(43,23,18,.06);
  --r:20px;
}
.c-red{--c:var(--red);--c50:var(--red-50)}
.c-green{--c:var(--green);--c50:var(--green-50)}
.c-gold{--c:#b97a0b;--c50:var(--gold-50)}
.c-blue{--c:var(--blue);--c50:var(--blue-50)}
.c-purple{--c:var(--purple);--c50:var(--purple-50)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{font-family:"Poppins",system-ui,sans-serif;font-weight:500;color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh;
  background:radial-gradient(120% 60% at 50% -10%,#fbe0d6 0%,rgba(251,224,214,0) 60%),var(--bg)}
img{display:block;max-width:100%;height:auto}
b,strong{font-weight:700}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{max-width:480px;margin:0 auto;padding:max(8px,env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
.hl{background:linear-gradient(transparent 55%,#ffe0a3 55%);padding:0 2px}
.warn{color:var(--red);background:linear-gradient(transparent 60%,#ffd0d0 60%);padding:0 2px}
.verde{color:var(--green)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.reveal{animation:up .5s ease both}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Botões ---------- */
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:62px;padding:16px 20px;border-radius:18px;text-align:center;text-decoration:none;
  background:linear-gradient(180deg,#34d46c,var(--cta));color:#fff;font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.3px;
  box-shadow:0 6px 0 var(--cta-dk),0 14px 26px -8px rgba(22,163,74,.55);transition:transform .08s,box-shadow .08s;margin-top:18px}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--cta-dk)}
.btn--pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}

/* ---------- Capa ---------- */
.cover{text-align:center;padding-top:18px}
.cover h1{font-size:29px;line-height:1.15;font-weight:800;letter-spacing:-.5px}
.lede{color:var(--muted);font-size:16px;margin:12px 0 18px}
.u{color:var(--ink);text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:3px;text-underline-offset:3px}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ba__item{position:relative;border-radius:18px;overflow:hidden;border:3px solid var(--red);background:#fff;aspect-ratio:3/4}
.ba__item--after{border-color:var(--green)}
.ba__item figcaption{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;font-weight:800;font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:99px;z-index:3}
.ba__item--after figcaption{background:var(--green)}

/* ---------- Espaços de imagem (placeholders) ---------- */
.slot{position:relative;overflow:hidden;border-radius:16px;background:repeating-linear-gradient(45deg,#fbeee6,#fbeee6 10px,#f7e4d8 10px,#f7e4d8 20px)}
.slot>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.slot__ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;text-align:center;border:2px dashed #d9a98f;border-radius:inherit;color:#8a5a44}
.slot__ph b{font-size:11.5px;font-weight:800;color:var(--red-dk);word-break:break-all}
.slot__ph span{font-size:11px;line-height:1.35}
.slot__ph small{font-size:10px;opacity:.75}
.ba .slot__ph{padding-top:32px}

/* ---------- Topo do quiz ---------- */
.q{padding-top:6px}
.q__top{display:flex;align-items:center;gap:12px;padding:6px 0 18px}
.q__back{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:var(--shadow);flex:none}
.q__back svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.q__progress{flex:1;height:10px;background:#f1e0d6;border-radius:99px;overflow:hidden}
.q__progress span{display:block;height:100%;background:linear-gradient(90deg,var(--red),#e5484d);border-radius:99px;transition:width .5s ease}
.q__count{font-weight:700;font-size:13px;color:var(--muted);min-width:30px;text-align:right}
.q__title{font-size:23px;line-height:1.22;font-weight:800;letter-spacing:-.3px;margin-bottom:6px}
.q__title--long{font-size:20.5px}
.q__sub{color:var(--muted);font-size:15px;margin-bottom:4px}
.q__options{list-style:none;display:flex;flex-direction:column;gap:11px;margin-top:16px}
.opt{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:2px solid var(--line);border-left:6px solid var(--c);border-radius:16px;padding:14px 14px;box-shadow:var(--shadow);transition:transform .08s,background .15s,border-color .15s}
.opt:active{transform:scale(.98)}
.opt__emoji{font-size:24px;width:30px;text-align:center;flex:none}
.opt__text{flex:1;font-size:15.5px;line-height:1.3}
.opt__check{width:24px;height:24px;border-radius:50%;border:2px solid #e4d2c7;flex:none;display:grid;place-items:center}
.opt.is-picked{background:var(--c50);border-color:var(--c)}
.opt.is-picked .opt__check{background:var(--c);border-color:var(--c)}
.opt.is-picked .opt__check::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.q-img{margin:12px 0 -6px;height:min(36dvh,290px);border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fff;
  -webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
.q-img img{width:100%;height:100%;object-fit:cover;object-position:top}

/* ---------- Telas de conteúdo ---------- */
.checks{background:#fff;border-radius:var(--r);padding:16px 16px;box-shadow:var(--shadow);margin-top:16px}
.checks__title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--wine);margin-bottom:10px}
.checks ul{list-style:none;display:flex;flex-direction:column;gap:10px}
.checks li{display:flex;align-items:center;gap:10px;font-size:15.5px}
.ok{width:26px;height:26px;border-radius:50%;background:var(--green);display:grid;place-items:center;flex:none}
.ok svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ok--bad{background:var(--red)}
.punch{text-align:center;font-size:19px;font-weight:800;line-height:1.3;margin-top:18px}
.punch__hl{color:var(--green)}
.note{border-radius:16px;padding:14px 16px;margin-top:14px;border-left:6px solid}
.note b{display:block;font-size:16px;margin-bottom:3px}
.note p{font-size:15px}
.note--alert{background:var(--gold-50);border-color:var(--orange)}
.note--good{background:var(--green-50);border-color:var(--green)}
.note--good b{color:var(--green)}
.photo{margin-top:16px;aspect-ratio:3/4;border-radius:20px;box-shadow:var(--shadow)}

/* ---------- Demo animada do app ---------- */
.shot-wrap{margin-top:14px;display:flex;justify-content:center}
.phone{width:236px;border-radius:34px;background:#1c1210;padding:9px;box-shadow:0 24px 40px -18px rgba(60,15,15,.5)}
.phone--sm{width:132px;border-radius:22px;padding:6px}
.scr{position:relative;border-radius:26px;overflow:hidden;background:#fffaf6;aspect-ratio:9/17.5}
.phone--sm .scr{border-radius:17px}
.scr__bar{background:var(--red);color:#fff;font-weight:800;font-size:12px;padding:12px 12px 10px;display:flex;align-items:center;gap:6px}
.phone--sm .scr__bar{font-size:7.5px;padding:7px 7px 6px}
.scr__body{padding:10px}
.phone--sm .scr__body{padding:6px}
.scr__lbl{font-size:10.5px;font-weight:700;color:var(--muted);margin:2px 0 7px}
.phone--sm .scr__lbl{font-size:6.5px;margin-bottom:4px}
.chipz{display:flex;flex-wrap:wrap;gap:5px}
.chipz i{font-style:normal;font-size:10.5px;font-weight:700;background:#fff;border:1.5px solid var(--line);padding:4px 8px;border-radius:99px;opacity:0;transform:scale(.6);transition:all .3s cubic-bezier(.3,1.6,.5,1)}
.phone--sm .chipz i{font-size:6.5px;padding:2px 5px;border-width:1px}
.chipz i.on{opacity:1;transform:none;background:var(--green-50);border-color:var(--green);color:#11602f}
.scr__btn{margin-top:10px;background:var(--cta);color:#fff;text-align:center;font-weight:800;font-size:11px;border-radius:10px;padding:8px;transition:transform .2s}
.phone--sm .scr__btn{font-size:7px;padding:5px;border-radius:7px;margin-top:6px}
.scr__btn.tap{transform:scale(.92);background:var(--cta-dk)}
.scr__search{position:absolute;inset:38px 0 0 0;background:rgba(255,250,246,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:0;pointer-events:none;transition:opacity .3s;padding:14px;text-align:center}
.scr__search.on{opacity:1}
.scr__search p{font-size:11px;font-weight:700;color:var(--wine)}
.phone--sm .scr__search p{font-size:7px}
.phone--sm .scr__res,.phone--sm .scr__search{top:24px}
.pv-carrossel .slot__ph{padding:10px 50px}
.spinner{width:38px;height:38px;border-radius:50%;border:4px solid #f3dcd0;border-top-color:var(--red);animation:spin .8s linear infinite}
.phone--sm .spinner{width:22px;height:22px;border-width:3px}
@keyframes spin{to{transform:rotate(360deg)}}
.scr__res{position:absolute;inset:38px 0 0 0;background:#fffaf6;opacity:0;pointer-events:none;transition:opacity .3s}
.scr__res.on{opacity:1}
.rc{display:flex;gap:7px;align-items:center;background:#fff;border-radius:10px;padding:5px;margin-bottom:6px;box-shadow:0 2px 8px rgba(0,0,0,.07);opacity:0;transform:translateY(10px);transition:all .35s ease}
.rc.on{opacity:1;transform:none}
.rc img{width:36px;height:36px;border-radius:7px;object-fit:cover;flex:none}
.rc b{display:block;font-size:10.5px;line-height:1.2}
.rc small{display:block;font-size:9px;color:var(--green);font-weight:700}
.phone--sm .rc{gap:4px;padding:3px;border-radius:6px;margin-bottom:4px}
.phone--sm .rc img{width:20px;height:20px;border-radius:4px}
.phone--sm .rc b{font-size:6.5px}
.phone--sm .rc small{font-size:5.5px}
.res__top{font-size:12px;font-weight:800;color:var(--green);margin-bottom:8px;text-align:center}
.phone--sm .res__top{font-size:7.5px;margin-bottom:5px}
.steps-mini{list-style:none;counter-reset:s}
.steps-mini li{font-size:9.5px;display:flex;gap:6px;margin-bottom:6px;line-height:1.3;opacity:0;transition:opacity .3s}
.steps-mini li.on{opacity:1}
.steps-mini li::before{counter-increment:s;content:counter(s);width:15px;height:15px;border-radius:50%;background:var(--red);color:#fff;font-size:8.5px;font-weight:800;display:grid;place-items:center;flex:none}
.phone--sm .steps-mini li{font-size:6px;gap:3px;margin-bottom:4px}
.phone--sm .steps-mini li::before{width:10px;height:10px;font-size:5.5px}
.rec__img{height:64px;border-radius:9px;overflow:hidden;margin-bottom:7px}
.phone--sm .rec__img{height:38px;border-radius:5px;margin-bottom:4px}
.rec__img img{width:100%;height:100%;object-fit:cover}
.rec__t{font-size:12px;font-weight:800;margin-bottom:5px}
.phone--sm .rec__t{font-size:7.5px;margin-bottom:3px}

.cel{width:calc(var(--w) + 18px);margin:0 auto;padding:9px;border-radius:calc(var(--w) * .16);background:#141414;position:relative;
  box-shadow:0 24px 40px -18px rgba(60,15,15,.55),inset 0 0 0 2px #3a3a3a}
.cel__tela{position:relative;width:var(--w);aspect-ratio:390/844;border-radius:calc(var(--w) * .12);overflow:hidden;background:#fffaf6}
.cel__tela img{display:block;width:100%;height:100%;object-fit:cover}
.cel__tela iframe{position:absolute;top:0;left:0;width:390px;height:844px;border:0;transform:scale(var(--esc));transform-origin:0 0;pointer-events:none}
.cel__ao-vivo{position:absolute;top:-11px;right:-6px;background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.how .cel{flex:none;padding:5px;border-radius:18px}
.how .cel__tela{border-radius:13px}
/* ---------- Como usar ---------- */
.how{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.how__step{display:flex;gap:12px;align-items:center;background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--shadow);border-top:5px solid var(--c)}
.how__n{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;display:grid;place-items:center;flex:none;align-self:flex-start}
.how__body{flex:1}
.how__eyebrow{font-size:11px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.5px}
.how__body h3{font-size:16.5px;line-height:1.2;margin:2px 0 4px}
.how__body p{font-size:13.5px;color:var(--muted)}

/* ---------- Diagnóstico ---------- */
.diag{text-align:center;padding-top:30px}
.ring{width:150px;height:150px;margin:0 auto 20px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke:#f1e0d6;stroke-width:10}
.ring .ring__bar{stroke:var(--red);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:calc(100 - var(--p));transition:stroke-dashoffset .15s linear}
.ring__n{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:800}
.diag__steps{list-style:none;text-align:left;margin-top:20px;display:flex;flex-direction:column;gap:12px}
.diag__steps li{display:flex;gap:11px;align-items:flex-start;opacity:.4;transition:opacity .3s}
.diag__steps li.is-active,.diag__steps li.is-done{opacity:1}
.diag__steps b{display:block;font-size:14.5px;line-height:1.3}
.diag__steps small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.diag__ic{width:24px;height:24px;border-radius:50%;border:2px solid #e3cfc4;flex:none;display:grid;place-items:center;position:relative;margin-top:1px}
.diag__ic .spin{display:none;position:absolute;inset:-2px;border-radius:50%;border:2px solid transparent;border-top-color:var(--red);animation:spin .8s linear infinite}
.diag__ic svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;display:none}
li.is-active .diag__ic .spin{display:block}
li.is-done .diag__ic{background:var(--green);border-color:var(--green)}
li.is-done .diag__ic svg{display:block}
.diag__res{text-align:left;opacity:0;transform:translateY(12px);transition:all .5s ease}
.diag__res.is-in{opacity:1;transform:none}
.diag__tag{display:table;margin:0 auto 10px;background:#fff;border:2px solid var(--line);border-radius:99px;padding:5px 14px;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.diag__res .q__title{text-align:center}
.risk{background:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-top:14px}
.risk__top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:14.5px}
.risk__lvl{color:#fff;border-radius:10px;padding:5px 11px;font-size:13px;text-transform:uppercase;flex:none}
.risk__lvl--alto{background:var(--red)}.risk__lvl--médio{background:var(--orange)}.risk__lvl--moderado{background:#eab308}
.risk__bar{height:14px;background:#f1e7e1;border-radius:99px;margin:12px 0 8px;overflow:hidden}
.risk__bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#16a34a,#eab308 55%,#ef4444);transition:width 1.4s cubic-bezier(.2,.8,.2,1) .3s}
.is-in .risk__bar i{width:var(--w)}
.risk__time{font-size:13.5px;color:var(--muted);font-weight:600}
.finds{background:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-top:14px}
.finds ul{list-style:none;display:flex;flex-direction:column;gap:12px}
.finds li{display:flex;gap:10px;font-size:15px;line-height:1.4}
.finds__ic{width:28px;height:28px;border-radius:8px;background:var(--gold-50);color:#c57d07;display:grid;place-items:center;flex:none;font-size:15px}

/* ================= PÁGINA DE VENDAS ================= */
.pv{margin:0 -16px}
.sec{padding:30px 20px}
.sec--claro{background:transparent}
.sec--branco{background:#fff}
.sec--escuro{background:var(--wine);color:#fff}
.sec--ouro{background:#ffefc7}
.sec--rosa{background:#fcdfe3}
.sec--pessego{background:#fde3cf}
.sec--sem{background:linear-gradient(180deg,#c3121e,#8f0d16);color:#fff}
.sec--com{background:linear-gradient(180deg,#169445,#0e6b31);color:#fff}
.sec--dor{background:#fff}
.sec--verde-esc{background:#0f3d26;color:#fff}
.sec{box-shadow:inset 0 10px 14px -12px rgba(0,0,0,.18)}
.pv__bar{display:grid;grid-template-columns:38px 1fr 38px;align-items:center;margin-bottom:14px}
.logo{text-align:center;font-weight:800;line-height:1.05;font-size:18px;color:var(--wine)}
.logo span{display:block;color:var(--red);font-size:22px}
.logo small{display:block;font-size:10px;letter-spacing:2px;color:var(--green);text-transform:uppercase}
.pv__h1{text-align:center;font-size:27px;line-height:1.18;font-weight:800;letter-spacing:-.4px}
.pv-red{color:var(--red)}
mark.amb{background:#ffd56b;border-radius:8px;padding:0 6px;color:inherit}
mark.mt{background:linear-gradient(transparent 55%,#ffd0a0 55%);color:inherit;padding:0 2px}
.zap-selo{display:flex;align-items:center;justify-content:center;gap:9px;background:#fff;border-radius:99px;padding:9px 16px;margin:16px auto;box-shadow:var(--shadow);font-size:14px;font-weight:600;width:max-content;max-width:100%}
.zap-selo__ic{width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none;font-size:15px}
.topo{position:relative;border-radius:22px;overflow:visible}
.topo .slot{aspect-ratio:16/9;border-radius:22px}
.orc{position:absolute;right:-6px;bottom:-22px;width:52%;background:#fff;border-radius:14px;box-shadow:0 16px 30px -10px rgba(0,0,0,.35);overflow:hidden;z-index:5;font-size:9.5px}
.orc__top{background:var(--red);color:#fff;font-weight:800;padding:7px 9px;font-size:10.5px}
.orc__corpo{padding:8px 9px}
.orc__lbl{font-weight:700;color:var(--muted);font-size:8.5px;margin-bottom:4px}
.orc__chips{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:7px}
.orc__chips i{font-style:normal;background:var(--green-50);color:#11602f;border:1px solid var(--green);border-radius:99px;padding:1px 6px;font-weight:700;font-size:8.5px}
.orc__res{display:flex;justify-content:space-between;align-items:center;background:var(--gold-50);border-radius:8px;padding:6px 7px;font-weight:800}
.orc__res b{background:var(--green);color:#fff;border-radius:6px;padding:2px 6px}
.card{background:#fff;border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.card:last-child{margin-bottom:0}
.card p{font-size:15.5px;margin-top:8px}
.card__head{display:flex;align-items:center;gap:12px}
.card__head h3{font-size:19px;line-height:1.2;font-weight:800}
.card--escuro{background:var(--wine);color:#fff}
.card--verde{background:#eaf8ee}
.tile{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none}

/* passo 0 = ciclo completo · 1 = colocando ingredientes · 2 = buscando e mostrando · 3 = passo a passo */
function mountDemo(root, passo) {
  if (!root) return () => {};
  let alive = true, timers = [];
  const at = (ms, fn) => timers.push(setTimeout(() => alive && fn(), ms));
  const run = () => {
    timers.forEach(clearTimeout); timers = [];
    const chips = [...root.querySelectorAll("[data-chips] i")], go = root.querySelector("[data-go]"),
      se = root.querySelector("[data-search]"), res = root.querySelector("[data-res]"),
      cards = [...root.querySelectorAll(".rc")], steps = [...root.querySelectorAll("[data-steps] li")];
    if (passo === 3) {
      steps.forEach(s => s.classList.remove("on"));
      steps.forEach((s, i) => at(500 + i * 650, () => s.classList.add("on")));
      at(500 + steps.length * 650 + 2200, run);
      return;
    }
    chips.forEach(c => c.classList.remove("on")); se.classList.remove("on"); res.classList.remove("on"); cards.forEach(c => c.classList.remove("on"));
    if (passo === 2) { chips.forEach(c => c.classList.add("on")); }
    let t = 300;
    if (passo !== 2) chips.forEach((c, i) => at(t + i * 260, () => c.classList.add("on")));
    t += passo === 2 ? 400 : chips.length * 260 + 300;
    if (passo === 1) { at(t + 2200, run); return; }
    at(t, () => go.classList.add("tap")); at(t + 220, () => go.classList.remove("tap"));
    at(t + 300, () => se.classList.add("on"));
    at(t + 1900, () => { se.classList.remove("on"); res.classList.add("on"); });
    cards.forEach((c, i) => at(t + 2100 + i * 280, () => c.classList.add("on")));
    at(t + 2100 + cards.length * 280 + 2600, run);
  };
  run();
  return () => { alive = false; timers.forEach(clearTimeout); };
}

/* largura = largura da tela do celular desenhado (px). A demo roda em 390×844 e é reduzida por CSS. */

  return `<div class="cel cel--demo" style="--w:${largura}px;--esc:${esc}">

    <span class="cel__ao-vivo">● Ao vivo</span>
  </div>`;
}
function appPrint(arquivo, largura, alt) {
  return `<div class="cel" style="--w:${largura}px"><div class="cel__tela"><img src="img/${arquivo}" alt="${alt}" loading="lazy" decoding="async"></div></div>`;
}
/* só carrega e só roda a demo enquanto ela está visível na tela */
const demoObs = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => {
  const f = e.target, w = () => f.contentWindow;
  if (e.isIntersecting) {
    if (!f.src) {
      f.src = f.dataset.src;
      f.addEventListener("load", () => [300, 900, 2000].forEach(t => setTimeout(() => f.dataset.vis === "1" && w() && w().postMessage("ceia-demo:continuar", "*"), t)));
    }
    f.dataset.vis = "1";
    if (w()) w().postMessage("ceia-demo:continuar", "*");
  } else {
    f.dataset.vis = "0";
    if (w()) w().postMessage("ceia-demo:pausar", "*");
  }
}), { threshold: 0.25 }) : null;
function ligarDemos(root) {
  root.querySelectorAll(".cel--demo iframe").forEach(f => {
    if (demoObs) demoObs.observe(f); else f.src = f.dataset.src.replace("&auto=0", "");
  });
  return () => root.querySelectorAll(".cel--demo iframe").forEach(f => demoObs && demoObs.unobserve(f));
}

function mountSales(el) {
  const pararDemos = ligarDemos(el);
  document.body.style.background = "var(--bg)";
  track("ViewContent", { content_name: "pagina_de_vendas" });
  /* entrada suave dos blocos ao rolar */
  const nodes = [...el.querySelectorAll(".card,.lista li,.tit,.apoio,.foto,.offer,.aviso,.pv-faq__item,.ad__par,.telas__fones,.passos li,.fecho")];
  nodes.forEach(n => n.classList.add("sq"));
  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("on"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -6% 0px" });
    nodes.forEach(n => io.observe(n));
  } else nodes.forEach(n => n.classList.add("on"));
  /* carrossel */
  const car = el.querySelector("[data-carrossel]");
  if (car) {
    const tr = car.querySelector(".pv-carrossel__trilho"), dots = [...el.querySelectorAll(".pv-carrossel__pontos i")], total = dots.length; let i = 0;
    const go = k => { i = (k + total) % total; tr.style.transform = `translateX(-${i * 100}%)`; dots.forEach((d, j) => d.classList.toggle("on", j === i)); };
    car.querySelectorAll("[data-dir]").forEach(b => b.addEventListener("click", () => { sfx.click(); go(i + +b.dataset.dir); }));
    let sx = 0; car.addEventListener("touchstart", e => sx = e.touches[0].clientX, { passive: true });
    car.addEventListener("touchend", e => { const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) go(i + (dx < 0 ? 1 : -1)); });
  }
  /* checkout */
  el.querySelectorAll("[data-checkout]").forEach(a => a.addEventListener("click", () => {
    sfx.click();
    track("InitiateCheckout", { value: Number(CONFIG.preco.replace(",", ".")), currency: "BRL" });
  }));
  el.querySelectorAll("details").forEach(d => d.addEventListener("toggle", () => d.open && sfx.click()));
  return pararDemos;
}

/* =========================================================
   MOTOR DO QUIZ
   ========================================================= */
const state = { step: 0, answers: {}, history: [] };
const appEl = document.getElementById("app");
let cleanup = null;

function render() {
  if (cleanup) { try { cleanup(); } catch (e) {} cleanup = null; }
  const s = STEPS[state.step];
  appEl.innerHTML = s.render();
  window.scrollTo(0, 0);
  const c = s.mount && s.mount(appEl);
  if (typeof c === "function") cleanup = c;
  appEl.querySelectorAll("[data-next]").forEach(b => b.addEventListener("click", () => {
    if (s.onNext) s.onNext(); else sfx.click();
    next();
  }));
  appEl.querySelectorAll("[data-back]").forEach(b => b.addEventListener("click", () => { sfx.click(); back(); }));
}
function next() { if (state.step < STEPS.length - 1) { state.history.push(state.step); state.step++; render(); } }
function back() { if (state.history.length) { state.step = state.history.pop(); render(); } }

/* Teste: abra a página com ?etapa=oferta (ou diagnostico, como-usar...) para ir direto a uma tela */
(function () {
  const etapa = new URLSearchParams(location.search).get("etapa");
  if (etapa) {
    const i = STEPS.findIndex(s => s.id === etapa);
    if (i >= 0) {
      Object.assign(state.answers, { cardapio: "Procuro receitas na internet", lista: "Faço lista, mas esqueço o que já tenho", gastou: "Sim, todo ano estoura", despensa: "Compro de novo sem saber que já tinha", tempo: "Dias pensando nisso" });
      state.step = i;
    }
  }
})();
render();
</script>
